<!DOCTYPE html>
<html lang="hy">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#1d4ed8" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>ՃՈ Քննական Հարցաշար · ABC Կարգեր</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Armenian:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css?v=20261113b" />
</head>
<body>
  <header class="app-header">
    <div class="header-inner">
      <button type="button" class="brand brand-btn" id="btn-brand-home" title="Վերադառնալ գլխավոր էջ">
        <div class="brand-badge" aria-hidden="true">ABC</div>
        <div>
          <h1 class="brand-title">Varordakan · ՃՈ Քննական Հարցաշար</h1>
          <p class="brand-subtitle" id="overall-progress-text">1050 հարց · 282 նշան</p>
        </div>
      </button>
    </div>

    <nav class="tab-nav" aria-label="Հիմնական բաժիններ">
      <button type="button" class="tab-btn" data-tab="home">
        Գլխավոր
      </button>
      <button type="button" class="tab-btn" data-tab="practice">
        Ուսուցում
      </button>
      <button type="button" class="tab-btn" data-tab="exam">
        Քննություն (20 հարց)
      </button>
      <button type="button" class="tab-btn" data-tab="mistakes">
        Սխալներ
        <span class="badge" id="mistakes-badge">0</span>
      </button>
      <button type="button" class="tab-btn" data-tab="signs">
        Նշաններ
      </button>
      <button type="button" class="tab-btn" data-tab="colortest">
        Գունաընկալում
      </button>
      <button type="button" class="tab-btn" data-tab="cheatsheet">
        Հուշաթերթ
      </button>
      <button type="button" class="tab-btn" data-tab="search">
        Որոնում
      </button>
    </nav>
  </header>

  <main class="app-main" id="app-root">
    <div class="card empty-state" style="padding: 40px 16px;">
      <p style="margin: 0; font-weight: 600; color: var(--text);">Բեռնվում է կայքը...</p>
    </div>
  </main>

  <footer class="app-footer">
    <div class="footer-inner">
      <span>ՀՀ ՃՈ Տեսական Քննություն · ABC Կարգեր</span>
      <span class="visit-stats" id="visit-stats" hidden>
        Այցելուներ՝ <strong id="stat-visitors">—</strong> · Բացումներ՝ <strong id="stat-opens">—</strong>
      </span>
    </div>
  </footer>

  <div class="lightbox" id="lightbox" hidden role="dialog" aria-modal="true" aria-label="Մեծացված նկար">
    <button type="button" class="lightbox-close" id="lightbox-close" aria-label="Փակել">✕</button>
    <img class="lightbox-img" id="lightbox-img" alt="Ճանապարհային իրավիճակի մեծացված նկար" />
  </div>

  <div class="modal-backdrop" id="sign-modal" hidden role="dialog" aria-modal="true" aria-labelledby="sign-modal-title">
    <div class="modal-card">
      <div class="modal-header">
        <h3 class="modal-title" id="sign-modal-title">Ճանապարհային նշան</h3>
        <button type="button" class="btn btn-sm btn-ghost" id="sign-modal-close" aria-label="Փակել">✕</button>
      </div>
      <div class="modal-body" id="sign-modal-body"></div>
    </div>
  </div>

  <div class="toast" id="toast" hidden role="status" aria-live="polite"></div>

  <script src="data/questions.js?v=20261113b"></script>
  <script src="data/signs.js?v=20261113b"></script>
  <script src="data/color_tests.js?v=20261113b"></script>
  <script src="app-core.js?v=20261113b"></script>
  <script src="app.js?v=20261113b"></script>
</body>
</html>
